id: io.github.petitlapin.Li-ri
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: Li-ri
finish-args:
  - --socket=pulseaudio
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
modules:
  - name: libmodplug
    sources:
      - type: archive
        url: https://sourceforge.net/projects/modplug-xmms/files/libmodplug/0.8.9.0/libmodplug-0.8.9.0.tar.gz
        sha256: 457ca5a6c179656d66c01505c0d95fafaead4329b9dbaa0f997d00a3508ad9de

    # NOTE: SDL2_mixer is rebuilt locally with libmodplug support to preserve XM module playback.
    # The version provided by the Flathub runtime does not support XM music, so this duplication is intentional.
    # This can be removed if the runtime SDL2_mixer gains XM support (e.g. via libmodplug or libxmp).
  - name: sdl_mixer
    config-opts:
      - --enable-music-mod-modplug=yes
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.6.2/SDL2_mixer-2.6.2.tar.gz
        sha256: 8cdea810366decba3c33d32b8071bccd1c309b2499a54946d92b48e6922aa371

  - name: simpleini
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
    post-install:
      - cp ../ConvertUTF.h /app/include/
    sources:
      - type: git
        url: https://github.com/brofield/simpleini.git
        commit: f7862c3dd7ad35becc2741f268e3402e89a37666

  - name: Li-ri
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_SYSTEM_SIMPLEINI=ON
      - -DLIRI_DATA_DIR=/app/share/Li-ri/
    sources:
      - type: git
        url: https://github.com/petitlapin/Li-Ri.git
        commit: d7187c24ecdc5de10af3ab326611ec9172e7e9f1
